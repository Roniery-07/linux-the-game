[project]
name = "linux-the-game"
version = "0.1.0"
description = "O Último Kernel: Linux From Scratch RPG (LFS 13.1)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lfs_game"]

[project.scripts]
lfs-game = "lfs_game.main:main"

